<div class="login-container">
  <section class="hero">
    <div class="hero-marca">
      <svg class="simbolo" viewBox="0 0 120 120" role="img" aria-label="ZoomPositivo">
        <g transform="translate(60,60)" fill="none" stroke-linecap="round">
          <circle r="44" stroke="currentColor" stroke-width="6" stroke-dasharray="233 43.4" transform="rotate(118)"/>
          <circle r="30" stroke="currentColor" stroke-width="6" stroke-dasharray="162 26.5" transform="rotate(-28)"/>
          <path class="cruz" d="M-14 0H14M0 -14V14" stroke-width="11"/>
        </g>
      </svg>
      <span>Gestor</span>
    </div>
    <h1>Entrar</h1>
    <p>TimeSheet, tarefas, financeiro e agenda.</p>
  </section>

  <div class="login-card">
    <form (ngSubmit)="login()" #f="ngForm">
      <div class="form-group">
        <label for="username">Utilizador</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">person</mat-icon>
          <input id="username" type="text" [(ngModel)]="username" name="username"
                 placeholder="Nome de utilizador" autocomplete="username" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">lock</mat-icon>
          <input id="password" [type]="showPassword() ? 'text' : 'password'"
                 [(ngModel)]="password" name="password"
                 placeholder="Password" autocomplete="current-password" required />
          <button type="button" mat-icon-button class="toggle-pw"
                  (click)="showPassword.update(v => !v)">
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error-msg">
          <mat-icon>error_outline</mat-icon>
          {{ error() }}
        </div>
      }

      <button type="submit" class="login-btn" [disabled]="loading()">
        @if (loading()) { A entrar... } @else { Entrar }
      </button>
    </form>
  </div>
</div>
